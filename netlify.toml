[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache 3D model files for 1 year — only downloaded once per browser
[[headers]]
  for = "/models/*.glb"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "model/gltf-binary"

# Cache self-hosted Draco decoder for 1 year
[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Next.js static assets for 1 year
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache other static assets for 1 day
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
